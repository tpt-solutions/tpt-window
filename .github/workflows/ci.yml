name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libraries (xkbcommon for Wayland, libudev for gilrs)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Docs must build with no warnings, including missing docs and broken intra-doc links.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libraries (xkbcommon for Wayland, libudev for gilrs)
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build rustdoc with warnings denied
        env:
          RUSTDOCFLAGS: "-D warnings -D missing_docs -D rustdoc::broken_intra_doc_links"
        run: cargo doc --workspace --no-deps

  # The documented minimum supported Rust version (see README and rust-version in Cargo.toml).
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libraries (xkbcommon for Wayland, libudev for gilrs)
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libudev-dev
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets

  # The Wayland lifecycle test needs a compositor, so start a headless weston.
  wayland:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install weston and xkbcommon
        run: sudo apt-get update && sudo apt-get install -y weston libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Start headless compositor
        run: |
          export XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --socket=wayland-test --idle-time=0 &
          for i in $(seq 1 50); do [ -S "$XDG_RUNTIME_DIR/wayland-test" ] && break; sleep 0.2; done
          test -S "$XDG_RUNTIME_DIR/wayland-test"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "WAYLAND_DISPLAY=wayland-test" >> "$GITHUB_ENV"
      - run: cargo test -p tpt-window-sys-wayland -- --nocapture

  # The X11 lifecycle test needs an X server, so run it under Xvfb.
  x11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - uses: dtolnay/rust-toolchain@stable
      - run: xvfb-run -a cargo test -p tpt-window-sys-x11 -- --nocapture

  # 32-bit Windows: the window user data pointer is 32 bits wide here.
  win32-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc
      - run: cargo test -p tpt-window-sys-win32 --target i686-pc-windows-msvc

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo check -p tpt-window-core -p tpt-window-sys-wasm --target wasm32-unknown-unknown

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The four templates in templates/ must build against this checkout. The script points their git
  # dependencies at the local crates, so this checks the templates as they are, not a release.
  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Linux system libraries (xkbcommon for Wayland, libudev for gilrs)
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libudev-dev
      - run: python3 scripts/check_templates.py

  # Examples open real windows, so they run on a Windows runner, which has a desktop session.
  # Each runs for a few seconds and must exit cleanly.
  examples:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the windowing examples
        shell: bash
        env:
          TPT_EXAMPLE_SECONDS: "2"
        run: |
          for ex in hello_window hello_run event_dump input_state multi_window file_drop; do
            cargo run -p tpt-window --example "$ex"
          done
          cargo run -p tpt-window --example record_replay -- record "$RUNNER_TEMP/session.tptrec" 2
          cargo run -p tpt-window --example record_replay -- replay "$RUNNER_TEMP/session.tptrec"
          cargo run -p tpt-window-test-utils --example headless_test

  # Undefined-behaviour checks on the pure-Rust core: the ring, the codec and the channel.
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo +nightly miri setup
      - run: cargo +nightly miri test -p tpt-window-core --lib

  # Line coverage for the crates with the most logic. Reported to the job log; no gate yet.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Linux system libraries (xkbcommon for Wayland, libudev for gilrs)
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libudev-dev
      - run: cargo llvm-cov -p tpt-window-core -p tpt-window-archon -p tpt-window-test-utils --summary-only

  # Public-API compatibility against the first commit, for the crates that existed there.
  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: tpt-window-core
          baseline-rev: c26e9ee

  # Drives the wasm harness in a real Chromium and checks the events the web backend reports.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Serve the harness and run the check
        working-directory: tpt-window-sys-wasm/browser-check
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          (cd www && python3 -m http.server 8123 >/dev/null 2>&1 &)
          npm ci
          npm run check

  # Fuzzing: each target runs for a minute on the nightly toolchain. Crashes fail the job.
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [codec_decode, protocol_decode, frame_ring, session_log_verify]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@cargo-fuzz
      - run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=60
        working-directory: fuzz
