[package]
name = "tpt-window-test-utils"
description = "tpt-window-test-utils: part of the tpt-window windowing layer for the TPT AV Stack"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["headless", "testing", "windowing", "ci", "fuzzing"]
categories = ["development-tools::testing", "gui"]

[dependencies]
tpt-window-core = { workspace = true }

[dev-dependencies]
tpt-window-core = { workspace = true, features = ["ecs"] }

[features]
# Strategies that generate window events for property tests.
proptest = ["dep:proptest"]

[dependencies.proptest]
version = "1"
optional = true
