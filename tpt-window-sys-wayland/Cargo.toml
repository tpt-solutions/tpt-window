[package]
name = "tpt-window-sys-wayland"
description = "tpt-window-sys-wayland: part of the tpt-window windowing layer for the TPT AV Stack"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["wayland", "linux", "windowing", "sctk", "smithay"]
categories = ["os::unix-apis", "gui"]

[dependencies]
raw-window-handle = "0.6"
tpt-window-core = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
sctk = { package = "smithay-client-toolkit", version = "0.19", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
