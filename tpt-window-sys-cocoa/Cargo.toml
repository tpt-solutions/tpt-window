[package]
name = "tpt-window-sys-cocoa"
description = "tpt-window-sys-cocoa: part of the tpt-window windowing layer for the TPT AV Stack"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["macos", "appkit", "cocoa", "windowing", "objc2"]
categories = ["os::macos-apis", "gui"]

[target.'cfg(target_os = "macos")'.dependencies]
tpt-window-core = { workspace = true }
raw-window-handle = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry", "NSDate", "NSThread", "NSRunLoop"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWindow", "NSEvent", "NSView", "NSScreen", "NSResponder", "NSGraphics", "NSRunningApplication", "NSColor", "NSWindowController", "NSGraphicsContext", "NSText", "NSMenu"] }

# AppKit must be driven from the process main thread, which libtest does not
# provide, so this target uses its own `main` (tests/real_window.rs).
[[test]]
name = "real_window"
harness = false
