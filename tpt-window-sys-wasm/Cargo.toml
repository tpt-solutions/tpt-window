[package]
name = "tpt-window-sys-wasm"
description = "tpt-window-sys-wasm: part of the tpt-window windowing layer for the TPT AV Stack"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["wasm", "webassembly", "canvas", "windowing", "web"]
categories = ["wasm", "gui"]

[dependencies]
raw-window-handle = "0.6"
tpt-window-core = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.107"
wasm-bindgen = "0.2.130"
web-sys = { version = "0.3.107", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "Node", "EventTarget", "Event", "KeyboardEvent", "MouseEvent", "WheelEvent", "TouchEvent", "Touch", "TouchList", "FocusEvent", "DomRect", "CssStyleDeclaration", "ResizeObserver", "ResizeObserverEntry", "CompositionEvent"] }
