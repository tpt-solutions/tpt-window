[package]
name = "tpt-window"
description = "tpt-window: part of the tpt-window windowing layer for the TPT AV Stack"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tpt-window-core = { workspace = true }

[target.'cfg(windows)'.dependencies]
tpt-window-sys-win32 = { path = "../tpt-window-sys-win32", version = "0.1.0" }

[target.'cfg(target_os = "macos")'.dependencies]
tpt-window-sys-cocoa = { path = "../tpt-window-sys-cocoa", version = "0.1.0" }

[target.'cfg(target_os = "linux")'.dependencies]
tpt-window-sys-wayland = { path = "../tpt-window-sys-wayland", version = "0.1.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tpt-window-sys-wasm = { path = "../tpt-window-sys-wasm", version = "0.1.0" }
