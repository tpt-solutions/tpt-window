[package]
name = "tpt-window"
description = "tpt-window: part of the tpt-window windowing layer for the TPT AV Stack"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["windowing", "window", "input", "engine", "surface"]
categories = ["gui", "game-development"]

[features]
default = []
# Engine resources (WindowResource, InputEventQueue) from core.
ecs = ["tpt-window-core/ecs"]
# The capability bridge, re-exported as `tpt_window::archon`.
archon = ["dep:tpt-window-archon"]
# Gamepad input, re-exported as `tpt_window::gamepad`.
gamepad = ["dep:tpt-window-gamepad"]

[dependencies]
tpt-window-core = { workspace = true }
raw-window-handle = "0.6"
tpt-window-archon = { path = "../tpt-window-archon", version = "0.1.0", optional = true }
tpt-window-gamepad = { path = "../tpt-window-gamepad", version = "0.1.0", optional = true }

[target.'cfg(windows)'.dependencies]
tpt-window-sys-win32 = { path = "../tpt-window-sys-win32", version = "0.1.0" }

[target.'cfg(target_os = "macos")'.dependencies]
tpt-window-sys-cocoa = { path = "../tpt-window-sys-cocoa", version = "0.1.0" }

[target.'cfg(target_os = "linux")'.dependencies]
tpt-window-sys-wayland = { path = "../tpt-window-sys-wayland", version = "0.1.0" }
tpt-window-sys-x11 = { path = "../tpt-window-sys-x11", version = "0.1.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tpt-window-sys-wasm = { path = "../tpt-window-sys-wasm", version = "0.1.0" }
