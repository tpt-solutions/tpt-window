[package]
name = "tpt-window-sys-win32"
description = "tpt-window-sys-win32: part of the tpt-window windowing layer for the TPT AV Stack"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
raw-window-handle = "0.6"
tpt-window-core = { workspace = true }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading"] }
