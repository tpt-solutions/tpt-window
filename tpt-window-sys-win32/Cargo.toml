[package]
name = "tpt-window-sys-win32"
description = "tpt-window-sys-win32: part of the tpt-window windowing layer for the TPT AV Stack"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["windows", "win32", "windowing", "dpi", "raw-input"]
categories = ["os::windows-apis", "gui"]

[target."cfg(windows)".dependencies]
tpt-window-core = { workspace = true }
raw-window-handle = "0.6"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_UI_Input_Touch", "Win32_UI_Input_Pointer", "Win32_UI_Input", "Win32_UI_Input_Ime", "Win32_Graphics_Dwm"] }
